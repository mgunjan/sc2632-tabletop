# Q2 registry rule must see every container a Pod starts, not only spec.containers (review, Sep 28).
apiVersion: v1
kind: Pod
metadata:
  name: init-from-docker-hub
  namespace: payments
  labels: {trustfall.example/egress-profile: db}
spec:
  initContainers:
    - name: setup
      image: docker.io/library/busybox:1.36
      securityContext: {allowPrivilegeEscalation: false}
  containers:
    - name: api
      image: registry.trustfall.internal/payments/api:2.14.2
      securityContext: {allowPrivilegeEscalation: false}
---
apiVersion: v1
kind: Pod
metadata:
  name: native-sidecar-from-docker-hub
  namespace: payments
  labels: {trustfall.example/egress-profile: db}
spec:
  initContainers:
    - name: sidecar
      image: docker.io/library/busybox:1.36
      restartPolicy: Always
      securityContext: {allowPrivilegeEscalation: false}
  containers:
    - name: api
      image: registry.trustfall.internal/payments/api:2.14.2
      securityContext: {allowPrivilegeEscalation: false}
---
apiVersion: v1
kind: Pod
metadata:
  name: init-from-internal-registry
  namespace: payments
  labels: {trustfall.example/egress-profile: db}
spec:
  initContainers:
    - name: setup
      image: registry.trustfall.internal/platform/migrate:4.1
      securityContext: {allowPrivilegeEscalation: false}
  containers:
    - name: api
      image: registry.trustfall.internal/payments/api:2.14.2
      securityContext: {allowPrivilegeEscalation: false}
