# The clean replacement the incident commander admits under Q3 (Scenario A's "masterful move":
# roll payments-api back to the clean tag while the suspects stay isolated for forensics).
apiVersion: v1
kind: Pod
metadata:
  name: clean-payments-api
  namespace: payments
  labels:
    app: payments-api
    trustfall.example/egress-profile: db
  annotations:
    trustfall.example/quarantine-override: incident-commander
spec:
  serviceAccountName: payments-api
  containers:
    - name: api
      image: registry.trustfall.internal/payments/api:2.14.2
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
