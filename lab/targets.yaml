# Things for payments workloads to (try to) reach, plus the ServiceAccounts the fixtures name.
# Stand-in image from lab/images/. Applied by lab/setup.sh; not part of the scenario story.
# Deployments, not bare Pods: a bare Pod evicted under node pressure stays dead, and every
# reachability check after it fails for a reason that has nothing to do with NetworkPolicy
# (seen on the first live run).
---
apiVersion: v1
kind: List
items:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: postgres
    namespace: database
  spec:
    replicas: 1
    selector:
      matchLabels: &id001
        app: postgres
    template:
      metadata:
        labels: *id001
      spec:
        containers:
        - name: postgres
          image: registry.trustfall.internal/platform/lab-target:1
          env:
          - name: PORT
            value: '5432'
          readinessProbe:
            tcpSocket:
              port: 5432
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
- apiVersion: v1
  kind: Service
  metadata:
    name: postgres
    namespace: database
  spec:
    selector: *id001
    ports:
    - port: 5432
      targetPort: 5432
